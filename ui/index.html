<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>QChat</title>
  <script src="mock.js"></script>
  <script src="settings-core.js"></script>
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="stage" id="stage">
    <div class="stack" id="stack">
      <section class="bubble-zone" id="bubble-zone" role="log" aria-live="polite" aria-relevant="additions" aria-label="ChatGPT response" hidden></section>

      <div class="notice glass glass-tiny" id="guest-notice" hidden>
        <p class="notice-text"><strong id="guest-title">Guest mode</strong> <span id="guest-message">Sign in to use your models and history.</span></p>
        <button type="button" class="btn btn-compact" id="btn-guest-signin">Sign in</button>
        <button type="button" class="icon-btn" id="btn-guest-dismiss" title="Dismiss" aria-label="Dismiss notice"><span class="icon" aria-hidden="true">&#xE8BB;</span></button>
      </div>

      <div class="notice notice-error glass glass-tiny" id="global-error" role="alert" hidden>
        <span class="icon icon-lead" aria-hidden="true">&#xE783;</span>
        <p class="notice-text" id="global-error-text"></p>
        <button type="button" class="btn btn-compact" id="btn-error-signin" hidden>Sign in</button>
        <button type="button" class="icon-btn" id="btn-error-dismiss" title="Dismiss" aria-label="Dismiss error"><span class="icon" aria-hidden="true">&#xE8BB;</span></button>
      </div>

      <div class="notice glass glass-tiny" id="clear-confirm" role="alertdialog" aria-label="Clear recent chats" hidden>
        <p class="notice-text">Clear recent chats from this PC?</p>
        <button type="button" class="btn btn-compact btn-accent" id="btn-clear-yes">Clear</button>
        <button type="button" class="btn btn-compact" id="btn-clear-no">Keep</button>
      </div>

      <div class="suggestions" id="suggestions" aria-label="Suggestions" hidden>
        <button type="button" class="suggestion glass glass-tiny" data-suggestion="Summarize this in three bullet points:&#10;&#10;"><span class="icon" aria-hidden="true">&#xE8A5;</span>Summarize</button>
        <button type="button" class="suggestion glass glass-tiny" data-suggestion="Explain what this code does:&#10;&#10;"><span class="icon" aria-hidden="true">&#xE943;</span>Explain code</button>
        <button type="button" class="suggestion glass glass-tiny" data-suggestion="Draft a short, friendly email about "><span class="icon" aria-hidden="true">&#xE715;</span>Draft an email</button>
      </div>

      <div class="slash-menu glass glass-tiny" id="slash-menu" role="listbox" aria-label="Commands" hidden></div>

      <div class="attachments" id="attachments" aria-live="polite" hidden></div>

      <nav class="tabs" id="tabs" aria-label="Recent chats" hidden></nav>

      <footer class="bar glass" id="bar">
        <input id="attachment-input" type="file" multiple hidden>
        <div class="orb" id="orb" data-tauri-drag-region title="Drag QChat">
          <span class="status-dot" id="status-dot" data-state="connecting"></span>
        </div>
        <span class="sr-only" id="status-label" role="status">Connecting…</span>
        <textarea class="bar-input" id="prompt-input" rows="1" placeholder="Ask anything" aria-label="Message" spellcheck="true" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="slash-menu"></textarea>
        <button type="button" class="bar-btn" id="btn-attach" aria-label="Attach files" title="Attach files"><span class="icon" aria-hidden="true">&#xE723;</span></button>
        <button type="button" class="bar-btn send-btn" id="btn-send" data-mode="send" title="Send" aria-label="Send" disabled><span class="icon" aria-hidden="true">&#xE74A;</span></button>
      </footer>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
