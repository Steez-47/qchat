[package]
name = "qchat"
version = "1.5.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "UI_ViewManagement", "Win32_System_DataExchange", "Win32_System_Memory", "UI_Composition", "UI_Composition_Desktop", "System", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Threading"] }
webview2-com = "0.39"
base64 = "0.23"
png = "0.18"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

