<!doctype html>
<meta charset="utf-8">
<title>QChat helper</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 "Segoe UI", sans-serif; }
  body { width: 300px; margin: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  label { display: flex; align-items: flex-start; gap: 8px; }
  input { margin: 4px 0 0; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
  button:disabled { cursor: default; }
  #status { font-size: 12px; }
</style>
<h1>Connect QChat</h1>
<p>This copies your ChatGPT session to QChat, granting access to your account. Continue only if you trust this app and helper.</p>
<label><input type="checkbox" id="consent">I understand and want to copy my own session</label>
<p><button id="connect" disabled>Copy session to QChat</button></p>
<p id="status" role="status">Open the QChat connect tab first.</p>
<script type="module" src="popup.js"></script>
